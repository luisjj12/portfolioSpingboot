spring.application.name=portfolioapp

# MySQL corriendo en Docker (docker-compose.yml). Puerto 3310 en el host
# para no chocar con MySQL80 (3306) ni con el MySQL de Laravel Sail (3309).
# Los valores por defecto son solo para desarrollo local; en cualquier otro
# entorno se deben sobreescribir con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3310/reservas_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.com.luisjimenez.portfolioapp=DEBUG

# jwt.secret por defecto solo para desarrollo local; en producción se
# debe definir la variable de entorno JWT_SECRET con un valor propio.
jwt.secret=${JWT_SECRET:4a68341050458a5c21d8e1adb4e9eb2e121cc84b0c4f704bf80630e31c193035}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Orígenes permitidos por CORS, separados por comas. Los de por defecto son
# el frontend en local y el desplegado en Vercel.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://portfolio-spingboot.vercel.app}
